<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwqWP9bb-32ojoRUOlKqz8oUMb-tCKxZfb29AJROWezSDw84CtTp9FwaPGb5ias_1ZP/exec";

function sendAnonymousData(){

const totalScore =
document.getElementById("totalText")
?.innerText
?.replace("点","") || "0";

const deviation =
document.getElementById("deviationText")
?.innerText || "0";

const selectedTags = "介護ストレス診断";

const url =
API_URL
+ "?totalScore=" + encodeURIComponent(totalScore)
+ "&deviation=" + encodeURIComponent(deviation)
+ "&selectedTags=" + encodeURIComponent(selectedTags)
+ "&t=" + new Date().getTime();

window.open(url, "_blank");

document.getElementById("sendStatus").textContent =
"保存ページを開きました。success と表示されたら保存完了です。";
}
</script>
