<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>介護士ストレス偏差値診断</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#fff5f1;
  color:#222;
}
.wrap{max-width:430px;margin:0 auto;padding:18px}
.card{
  background:#fff;
  border-radius:22px;
  padding:24px;
  margin:16px 0;
  box-shadow:0 8px 26px rgba(0,0,0,.08);
}
.badge{
  display:inline-block;
  background:#ffe4e6;
  color:#ef4444;
  padding:7px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}
h1{font-size:28px;line-height:1.35;color:#ef4444}
h2{font-size:21px}
.lead{font-size:15px;line-height:1.8}
.btn{
  width:100%;
  border:none;
  border-radius:999px;
  padding:17px;
  font-size:17px;
  font-weight:900;
  background:#ef4444;
  color:#fff;
  margin-top:14px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  display:block;
}
.btn.secondary{background:#fff;color:#ef4444;border:2px solid #ef4444}
.btn.line{background:#06c755}
.btn.note{background:#22c55e}
.btn.tiktok{background:#111}
.checkBox{margin-top:14px;font-weight:800}
.hidden{display:none!important}
.progressText{font-weight:900;margin-bottom:10px}
.progressWrap{
  height:10px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:22px;
}
.progressBar{height:100%;background:#ef4444;width:0%}
.qTitle{font-size:22px;font-weight:900;margin:18px 0}
.option{
  display:block;
  border:1.5px solid #e5e7eb;
  border-radius:15px;
  padding:16px;
  margin:12px 0;
  font-weight:800;
  background:#fff;
  cursor:pointer;
}
.option:hover,.option.selected{
  border-color:#ef4444;
  background:#fff1f2;
  color:#ef4444;
}
.result{display:none;border:2px solid #ef4444}
.score{
  font-size:60px;
  font-weight:1000;
  text-align:center;
  color:#ef4444;
  line-height:1;
}
.rank{
  text-align:center;
  display:block;
  margin:14px auto;
  background:#ffe4e6;
  color:#ef4444;
  padding:10px 18px;
  border-radius:999px;
  font-weight:900;
  width:max-content;
}
.comment{
  background:#fff7ed;
  padding:16px;
  border-radius:16px;
  line-height:1.8;
}
.factorBox{
  border:2px solid #fecaca;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}
.factorBox div{font-weight:900;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ddd;padding:7px;vertical-align:top}
th{background:#ef4444;color:white}
.small{font-size:12px;color:#666;line-height:1.7}
.footer{text-align:center;color:#999;font-size:12px;padding:24px 0}
</style>
</head>

<body>

<div class="wrap">

<section class="card" id="top">
  <span class="badge">介護士向け・無料診断</span>
  <h1>介護士ストレス偏差値診断<br>今の職場、危険ライン？</h1>
  <p class="lead">
    人手不足・夜勤・人間関係・給料不満などから、あなたの職場ストレスを偏差値風に診断します。
  </p>

  <a class="btn tiktok" href="https://www.tiktok.com/@kaigo_kasai_edogawaku" target="_blank">
    ① TikTokをフォローする
  </a>

  <label class="checkBox">
    <input type="checkbox" id="followCheck">
    TikTokをフォローしました
  </label>

  <button class="btn" onclick="startQuiz()">② 診断をはじめる</button>

  <p class="small">
    ※フォロー後にチェックして診断へ進んでください。
  </p>
</section>

<section class="card hidden" id="quizCard">
  <div class="progressText" id="progressText">質問 1 / 12</div>
  <div class="progressWrap">
    <div class="progressBar" id="progressBar"></div>
  </div>

  <div class="qTitle" id="questionTitle"></div>
  <div id="options"></div>
</section>

<section id="resultBox" class="card result"></section>

<section class="card">
  <h2>みんなの診断結果</h2>
  <p class="small">最新50件を自動表示します。</p>
  <div id="resultList">読み込み中...</div>
</section>

<div class="footer">介護士ストレス偏差値診断</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxw6agki5LqLpldEBuPaC0j0gxXerex75Q1tGZpRblPrgCdX7304R8x-B8votMaEEOmUw/exec";

const questions = [
  ["人手不足を感じる", [["まったく感じない",1],["少し感じる",2],["普通に感じる",3],["かなり感じる",4],["限界レベル",5]]],
  ["夜勤の負担が重い", [["問題ない",1],["少しきつい",2],["普通にきつい",3],["かなりきつい",4],["もう限界",5]]],
  ["人間関係で消耗している", [["ほぼない",1],["少しある",2],["普通にある",3],["かなりある",4],["毎日つらい",5]]],
  ["サービス残業がある", [["ない",1],["たまにある",2],["月数回ある",3],["よくある",4],["当たり前になっている",5]]],
  ["休憩が取れない", [["取れている",1],["少し削られる",2],["日による",3],["ほぼ取れない",4],["休憩という概念がない",5]]],
  ["入浴介助がきつい", [["問題ない",1],["少しきつい",2],["普通にきつい",3],["かなりきつい",4],["身体が限界",5]]],
  ["給料に納得していない", [["納得している",1],["少し不満",2],["普通に不満",3],["かなり不満",4],["割に合わなすぎる",5]]],
  ["シフトの融通が利かない", [["問題ない",1],["少し不満",2],["普通に不満",3],["かなり不満",4],["生活に支障がある",5]]],
  ["上司・管理者に不信感がある", [["ない",1],["少しある",2],["普通にある",3],["かなりある",4],["信用できない",5]]],
  ["職場の雰囲気が悪い", [["まったく悪くない",1],["少し気になる",2],["普通に悪い",3],["かなり悪い",4],["毎日しんどい",5]]],
  ["腰痛・身体的疲労がある", [["ほぼない",1],["少しある",2],["普通にある",3],["かなりある",4],["限界に近い",5]]],
  ["辞めたいと思う頻度", [["ほぼない",1],["たまにある",2],["月に何度かある",3],["週に何度もある",4],["毎日のように思う",5]]]
];

const labels = [
  "人手不足","夜勤負担","人間関係","サービス残業","休憩不足","入浴介助",
  "給料不満","シフト不満","上司不信","職場雰囲気","身体疲労","退職意向"
];

let current = 0;
let answers = Array(questions.length).fill(null);

function startQuiz(){
  if(!document.getElementById("followCheck").checked){
    alert("TikTokフォロー後にチェックを入れてください。");
    return;
  }

  document.getElementById("top").classList.add("hidden");
  document.getElementById("quizCard").classList.remove("hidden");
  document.getElementById("resultBox").style.display = "none";
  renderQuestion();
  document.getElementById("quizCard").scrollIntoView({behavior:"smooth"});
}

function renderQuestion(){
  const q = questions[current];

  document.getElementById("progressText").textContent = `質問 ${current + 1} / ${questions.length}`;
  document.getElementById("progressBar").style.width = `${((current + 1) / questions.length) * 100}%`;
  document.getElementById("questionTitle").textContent = `${current + 1}. ${q[0]}`;

  let html = "";
  q[1].forEach((opt,idx)=>{
    html += `
      <div class="option" onclick="selectAnswer(${idx})">
        ${opt[0]}
      </div>
    `;
  });

  document.getElementById("options").innerHTML = html;
}

function selectAnswer(idx){
  const opt = questions[current][1][idx];
  answers[current] = { text: opt[0], value: opt[1] };

  if(current < questions.length - 1){
    current++;
    renderQuestion();
    document.getElementById("quizCard").scrollIntoView({behavior:"smooth"});
  }else{
    diagnose();
  }
}

function diagnose(){
  document.getElementById("quizCard").classList.add("hidden");

  const total = answers.reduce((sum,a)=>sum + a.value,0);
  const deviation = Math.round(35 + ((total - 12) / 48) * 45);

  let rank = "";
  let comment = "";

  if(deviation >= 72){
    rank = "危険ライン";
    comment = "かなり危険です。あなたの我慢不足ではなく、職場環境そのものに問題がある可能性が高いです。";
  }else if(deviation >= 62){
    rank = "要注意";
    comment = "かなり消耗しています。今の職場が普通なのか、他の条件と比較した方がいい状態です。";
  }else if(deviation >= 52){
    rank = "ややストレス高め";
    comment = "今すぐ危険とは言い切れませんが、不満が積み上がりやすい状態です。";
  }else{
    rank = "比較的安定";
    comment = "現時点では大きな危険ラインではありません。ただし定期的な見直しは必要です。";
  }

  const tags = {};
  answers.forEach((a,i)=>tags[labels[i]] = a.value);

  const topFactors = Object.entries(tags)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map(x=>x[0]);

  document.getElementById("resultBox").style.display = "block";
  document.getElementById("resultBox").innerHTML = `
    <h2>診断結果</h2>
    <div class="score">${deviation}</div>
    <span class="rank">${rank}</span>

    <div class="comment">
      <p><strong>主なストレス要因TOP3</strong></p>
      <p>🥇 ${topFactors[0]}</p>
      <p>🥈 ${topFactors[1]}</p>
      <p>🥉 ${topFactors[2]}</p>
      <p>${comment}</p>
    </div>

    <h2>次にやること</h2>
    <p class="lead">
      今の職場が本当に普通なのか、他の介護職場と比較してみてください。
    </p>

    <a class="btn note" href="https://note.com/kaigo_tenshoku" target="_blank">
      noteで詳しく読む
    </a>

    <a class="btn line" href="https://lin.ee/Rxbphei" target="_blank">
      LINEで相談する
    </a>

    <button class="btn secondary" onclick="restartQuiz()">
      もう一度診断する
    </button>
  `;

  fetch(
    API_URL
    + "?totalScore=" + encodeURIComponent(total)
    + "&deviation=" + encodeURIComponent(deviation)
    + "&selectedTags=" + encodeURIComponent(JSON.stringify(tags))
  );

  setTimeout(loadResults,1000);
  document.getElementById("resultBox").scrollIntoView({behavior:"smooth"});
}

function restartQuiz(){
  current = 0;
  answers = Array(questions.length).fill(null);
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("top").classList.remove("hidden");
  document.getElementById("top").scrollIntoView({behavior:"smooth"});
}

function loadResults(){
  const old = document.getElementById("jsonpScript");
  if(old) old.remove();

  const script = document.createElement("script");
  script.id = "jsonpScript";
  script.src = API_URL + "?mode=list&callback=renderResults";
  document.body.appendChild(script);
}

function renderResults(data){
  if(!data || data.length === 0){
    document.getElementById("resultList").innerHTML = "まだ診断結果がありません。";
    return;
  }

  let html = `
    <table>
      <tr>
        <th>日時</th>
        <th>点数</th>
        <th>偏差値</th>
        <th>TOP3</th>
      </tr>
  `;

  data.forEach(item=>{
    html += `
      <tr>
        <td>${formatDate(item.date)}</td>
        <td>${item.score}</td>
        <td>${item.deviation}</td>
        <td>${formatTags(item.tags)}</td>
      </tr>
    `;
  });

  html += `</table>`;
  document.getElementById("resultList").innerHTML = html;
}

function formatDate(date){
  if(!date) return "";
  return String(date).replace("T"," ").slice(0,16);
}

function formatTags(tags){
  if(!tags) return "";
  try{
    const obj = typeof tags === "string" ? JSON.parse(tags) : tags;
    return Object.entries(obj)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,3)
      .map(x=>x[0])
      .join("・");
  }catch(e){
    return String(tags);
  }
}

loadResults();
</script>

</body>
</html>
