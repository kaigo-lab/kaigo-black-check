<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>介護士ストレス偏差値診断</title>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:20px;
    line-height:1.8;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h1{
    text-align:center;
}

.question{
    margin-bottom:25px;
    padding:15px;
    background:#fafafa;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    margin-top:20px;
    cursor:pointer;
}

.result{
    margin-top:30px;
    padding:20px;
    background:#fff8e1;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    font-size:14px;
}

th{
    background:#222;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>介護士ストレス偏差値診断</h1>

<div class="question">
<p>1. 人手不足を感じますか？</p>

<label><input type="radio" name="q1" value="4"> 常に感じる</label><br>
<label><input type="radio" name="q1" value="3"> 時々感じる</label><br>
<label><input type="radio" name="q1" value="1"> あまり感じない</label>
</div>

<div class="question">
<p>2. 夜勤負担は大きいですか？</p>

<label><input type="radio" name="q2" value="4"> 非常にきつい</label><br>
<label><input type="radio" name="q2" value="3"> ややきつい</label><br>
<label><input type="radio" name="q2" value="1"> 問題ない</label>
</div>

<div class="question">
<p>3. 人間関係のストレスは？</p>

<label><input type="radio" name="q3" value="4"> 強い</label><br>
<label><input type="radio" name="q3" value="3"> 少しある</label><br>
<label><input type="radio" name="q3" value="1"> 少ない</label>
</div>

<button onclick="diagnose()">
診断する
</button>

<div id="result" class="result"></div>

<h2>みんなの診断結果</h2>

<div id="resultList"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-6C8AOE-KpoM5H6JXG8gn4kW64kY6oAeInCg22mWxdHIg2vv1sQe-QGhLxpTjtnR9QA/exec";

async function diagnose(){

    let total = 0;

    const q1 = document.querySelector('input[name="q1"]:checked');
    const q2 = document.querySelector('input[name="q2"]:checked');
    const q3 = document.querySelector('input[name="q3"]:checked');

    if(!q1 || !q2 || !q3){
        alert("すべて回答してください");
        return;
    }

    total += Number(q1.value);
    total += Number(q2.value);
    total += Number(q3.value);

    const deviation = Math.min(80, Math.max(30, total * 6));

    let danger = "";

    if(deviation >= 70){
        danger = "かなり危険";
    }else if(deviation >= 55){
        danger = "注意";
    }else{
        danger = "比較的安全";
    }

    const tags = {
        "人手不足": q1.value,
        "夜勤負担": q2.value,
        "人間関係": q3.value
    };

    document.getElementById("result").innerHTML = `
        <h2>診断結果</h2>
        <p>ストレス偏差値：${deviation}</p>
        <p>判定：${danger}</p>
    `;

    // GAS保存
    fetch(
        API_URL
        + "?totalScore=" + total
        + "&deviation=" + deviation
        + "&selectedTags=" + encodeURIComponent(JSON.stringify(tags))
    );

    // 一覧更新
    loadResults();
}

async function loadResults(){

    const res = await fetch(API_URL + "?mode=list");

    const data = await res.json();

    let html = `
    <table>
        <tr>
            <th>日時</th>
            <th>スコア</th>
            <th>偏差値</th>
            <th>悩み</th>
        </tr>
    `;

    data.forEach(item => {

        html += `
        <tr>
            <td>${item.date}</td>
            <td>${item.score}</td>
            <td>${item.deviation}</td>
            <td>${item.tags}</td>
        </tr>
        `;
    });

    html += `</table>`;

    document.getElementById("resultList").innerHTML = html;
}

loadResults();

</script>

</body>
</html>
